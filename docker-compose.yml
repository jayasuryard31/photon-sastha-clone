services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: "*"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    # ports:
    #   - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
