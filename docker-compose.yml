services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: "*"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  redis-ui:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    environment:
      REDIS_URI: ${REDIS_URL}
    depends_on:
      - redis
